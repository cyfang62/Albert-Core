<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Serif TC','Songti TC',serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#efe4cf"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa8c9"/>
      <stop offset="1" stop-color="#4f8fb5"/>
    </linearGradient>
    <radialGradient id="lake" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#7db6d4"/>
      <stop offset="1" stop-color="#4f8fb5"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="700" fill="url(#sky)"/>
  <rect x="8" y="8" width="944" height="684" fill="none" stroke="#b89b6a" stroke-width="2.5"/>
  <rect x="14" y="14" width="932" height="672" fill="none" stroke="#b89b6a" stroke-width="1"/>

  <!-- title -->
  <text x="480" y="52" text-anchor="middle" font-size="30" fill="#5a4326" font-weight="700" letter-spacing="2">廬江郡水系圖</text>
  <text x="480" y="80" text-anchor="middle" font-size="15" fill="#7a5f38" letter-spacing="1">長江北岸 × 巢湖樞紐　—　河道關津之地基</text>
  <line x1="360" y1="92" x2="600" y2="92" stroke="#b89b6a" stroke-width="1"/>

  <!-- 廬江郡 territory (north bank band) -->
  <path d="M 120 300 Q 300 250 520 270 Q 720 285 860 250 L 860 470 Q 700 440 500 470 Q 300 500 150 460 Z"
        fill="#e7dcc0" stroke="#b89b6a" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.75"/>
  <text x="250" y="360" font-size="19" fill="#6b5330" font-weight="700" opacity="0.85">廬江郡</text>
  <text x="250" y="382" font-size="12" fill="#7a5f38" opacity="0.85">（長江以北·揚州）</text>

  <!-- 長江 (Yangtze): flows SW(lower-left) -> NE(upper-right) -->
  <path d="M 60 640 Q 260 560 460 540 Q 680 518 940 430"
        fill="none" stroke="url(#river)" stroke-width="46" stroke-linecap="round"/>
  <path d="M 60 640 Q 260 560 460 540 Q 680 518 940 430"
        fill="none" stroke="#bfe0ef" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <text x="300" y="600" font-size="20" fill="#eaf6fb" font-weight="700" transform="rotate(-13 300 600)" letter-spacing="3">長　江（大江·黃金水道）</text>
  <text x="640" y="520" font-size="12" fill="#eaf6fb" transform="rotate(-13 640 520)" letter-spacing="1">東北流 →</text>

  <!-- 江東 (south bank) -->
  <path d="M 60 700 Q 300 640 560 610 Q 780 592 960 500 L 960 700 Z" fill="#e3d8bd" opacity="0.7"/>
  <text x="700" y="650" font-size="18" fill="#6b5330" font-weight="700">江東（南岸）</text>
  <text x="700" y="672" font-size="12" fill="#7a5f38">→ 丹陽 · 吳郡（顧雍後勤）</text>

  <!-- 巢湖 (lake, north-center) -->
  <ellipse cx="560" cy="190" rx="105" ry="62" fill="url(#lake)" stroke="#3f7ea3" stroke-width="1.5" filter="url(#soft)"/>
  <text x="560" y="196" text-anchor="middle" font-size="20" fill="#eaf6fb" font-weight="700" letter-spacing="3">巢　湖</text>

  <!-- 濡須水: 巢湖 -> 長江 -->
  <path d="M 585 248 Q 605 340 640 430 Q 655 470 672 505" fill="none" stroke="url(#river)" stroke-width="15" stroke-linecap="round"/>
  <path d="M 585 248 Q 605 340 640 430 Q 655 470 672 505" fill="none" stroke="#bfe0ef" stroke-width="2" opacity="0.6"/>
  <text x="612" y="360" font-size="13" fill="#3f6f8c" font-weight="700" transform="rotate(70 612 360)">濡須水</text>

  <!-- 皖水 -> 皖口 (west/lower-left) -->
  <path d="M 120 250 Q 160 360 210 470 Q 232 512 258 545" fill="none" stroke="url(#river)" stroke-width="13" stroke-linecap="round"/>
  <text x="150" y="330" font-size="13" fill="#3f6f8c" font-weight="700" transform="rotate(68 150 330)">皖水</text>

  <!-- ===== place markers ===== -->
  <!-- 舒縣 (郡治, inland) -->
  <g transform="translate(360 355)" filter="url(#soft)">
    <path d="M 0 -15 L 4.6 -4.6 L 15 -4.6 L 6.7 2.4 L 9.5 13 L 0 6.5 L -9.5 13 L -6.7 2.4 L -15 -4.6 L -4.6 -4.6 Z" fill="#c0392b" stroke="#fff" stroke-width="1.2"/>
  </g>
  <text x="360" y="392" text-anchor="middle" font-size="17" fill="#5a2d24" font-weight="700">舒縣　★郡治</text>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#8a5a3a">內陸·陸康駐地（周瑜家鄉）</text>

  <!-- 皖口 / 皖縣 (江港, west) -->
  <circle cx="258" cy="545" r="8" fill="#e08a1e" stroke="#fff" stroke-width="1.5" filter="url(#soft)"/>
  <text x="258" y="533" text-anchor="middle" font-size="15" fill="#7a4a12" font-weight="700">皖口 · 皖縣</text>
  <text x="258" y="574" text-anchor="middle" font-size="11.5" fill="#8a5a3a">皖水入江 · 江港</text>

  <!-- 樅陽 (臨江) -->
  <circle cx="470" cy="537" r="8" fill="#e08a1e" stroke="#fff" stroke-width="1.5" filter="url(#soft)"/>
  <text x="470" y="525" text-anchor="middle" font-size="15" fill="#7a4a12" font-weight="700">樅陽</text>
  <text x="470" y="500" text-anchor="middle" font-size="11.5" fill="#8a5a3a">臨江·津渡</text>

  <!-- 居巢 / 濡須口 -->
  <circle cx="672" cy="505" r="8" fill="#e08a1e" stroke="#fff" stroke-width="1.5" filter="url(#soft)"/>
  <text x="700" y="500" font-size="15" fill="#7a4a12" font-weight="700">居巢 · 濡須口</text>
  <text x="700" y="518" font-size="11.5" fill="#8a5a3a">巢湖入江 · 江淮中轉要衝</text>

  <!-- 北：九江/壽春 -->
  <text x="820" y="150" text-anchor="middle" font-size="14" fill="#6b5330" font-weight="700">（北）</text>
  <text x="820" y="170" text-anchor="middle" font-size="13" fill="#7a5f38">九江郡 · 壽春</text>
  <path d="M 665 175 Q 740 165 790 168" fill="none" stroke="#9a7b4a" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- compass -->
  <g transform="translate(888 130)">
    <circle r="30" fill="#f6efe0" stroke="#b89b6a" stroke-width="1.4"/>
    <path d="M 0 -26 L 6 0 L 0 26 L -6 0 Z" fill="#c0392b"/>
    <path d="M 0 -26 L 6 0 L 0 0 Z" fill="#8a2016"/>
    <text x="0" y="-32" text-anchor="middle" font-size="12" fill="#5a4326" font-weight="700">北</text>
  </g>

  <!-- strategic note box -->
  <g transform="translate(40 470)">
    <rect x="0" y="0" width="300" height="86" rx="8" fill="#f6efe0" stroke="#b89b6a" stroke-width="1.2" opacity="0.95"/>
    <text x="14" y="24" font-size="13.5" fill="#5a4326" font-weight="700">水路十字路口 ＝ 軍事咽喉 ＝ 商業金礦</text>
    <text x="14" y="46" font-size="12" fill="#6b5330">東西向：長江（黃金水道·串腹地）</text>
    <text x="14" y="65" font-size="12" fill="#6b5330">南北向：巢湖—濡須—淮河（江淮中轉）</text>
    <text x="14" y="80" font-size="10.5" fill="#8a5a3a">陸議親赴江邊，把此樞紐做成最順的物流節點。</text>
  </g>

  <!-- legend -->
  <g transform="translate(770 588)">
    <rect x="0" y="0" width="170" height="94" rx="8" fill="#f6efe0" stroke="#b89b6a" stroke-width="1.2" opacity="0.95"/>
    <text x="12" y="20" font-size="12.5" fill="#5a4326" font-weight="700">圖　例</text>
    <path d="M 18 34 l 3.5 -8 l 3.5 8 l 8 0 l -6.5 5 l 2.5 8 l -7.5 -5 l -7.5 5 l 2.5 -8 l -6.5 -5 z" fill="#c0392b" transform="translate(-6 -2) scale(0.7)"/>
    <text x="34" y="38" font-size="11.5" fill="#6b5330">郡治（舒縣·內陸）</text>
    <circle cx="20" cy="55" r="6" fill="#e08a1e"/>
    <text x="34" y="59" font-size="11.5" fill="#6b5330">江港 / 津渡（沿江縣）</text>
    <rect x="14" y="70" width="14" height="8" fill="url(#river)" rx="2"/>
    <text x="34" y="78" font-size="11.5" fill="#6b5330">水路動脈</text>
  </g>

  <text x="480" y="676" text-anchor="middle" font-size="10.5" fill="#9a7b4a">《好人？》世界觀 · 廬江郡水系（示意·非比例）　史料：漢書地理志·廬江郡沿革·安徽長江/巢湖地理</text>
</svg>
